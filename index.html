<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحديث</title>
    <!-- Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: rtl;
        }

        /* هذا هو العنصر الرئيسي اللي طلبته بالضبط */
        .update-container {
            background: linear-gradient(145deg, #f8fafc, #e2e8f0) !important;
            border: none !important;
            box-shadow: inset 2px 2px 5px #ffffff, inset -2px -2px 5px #94a3b8, 3px 3px 8px rgba(0,0,0,0.1), -1px -1px 4px rgba(255,255,255,0.6) !important;
            border-radius: 30px;
            padding: 50px 60px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            min-width: 320px;
        }

        /* أيقونة السفينة مع الحركة */
        .ship-icon {
            font-size: 70px;
            color: #334155;
            animation: sailAnimation 3s ease-in-out infinite;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        /* النص */
        .update-text {
            font-size: 24px;
            font-weight: 600;
            color: #1e293b;
            letter-spacing: 1px;
            background: linear-gradient(to left, #475569, #1e293b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* حركة السفينة: تتمايل يمين ويسار مع ارتفاع بسيط كأنها على موج */
        @keyframes sailAnimation {
            0% {
                transform: translateX(0px) translateY(0px) rotate(-3deg);
            }
            25% {
                transform: translateX(8px) translateY(-8px) rotate(0deg);
            }
            50% {
                transform: translateX(0px) translateY(-12px) rotate(3deg);
            }
            75% {
                transform: translateX(-8px) translateY(-8px) rotate(0deg);
            }
            100% {
                transform: translateX(0px) translateY(0px) rotate(-3deg);
            }
        }

        /* تأثير نبض خفيف إضافي */
        .ship-icon i {
            animation: gentlePulse 2s ease-in-out infinite;
        }

        @keyframes gentlePulse {
            0%, 100% {
                opacity: 0.9;
            }
            50% {
                opacity: 1;
            }
        }

        /* نقاط تحميل صغيرة تحت النص */
        .dots {
            display: flex;
            gap: 8px;
            margin-top: 5px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: #64748b;
            border-radius: 50%;
            animation: dotBounce 1.4s ease-in-out infinite;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dotBounce {
            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% {
                transform: scale(1.3);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="update-container">
        <!-- أيقونة سفينة متحركة -->
        <div class="ship-icon">
            <i class="fas fa-ship"></i>
        </div>
        
        <!-- نص جاري التحديث -->
        <div class="update-text">جاري التحديث</div>
        
        <!-- نقاط تحميل متحركة -->
        <div class="dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>
</body>
</html>
